/*
 * OpenPGP keys imported into the rpm database (rpm --import, dnf) are
 * several gpg-pubkey packages; without Allow-Duplicated apt warns about
 * multiple versions of gpg-pubkey.
 */

RPM
{
	Allow-Duplicated {
		// OpenPGP keys imported into the rpm database (rpm --import, dnf).
		"^gpg-pubkey$";
	};
};
